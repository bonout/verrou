<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRF test bench</title>
<!--
  WebAuthn PRF extension (scripts/ios-autofill-e2e.sh, test6): a passkey
  created with `extensions.prf`, then two sign-ins that evaluate the PRF.
  The page checks that:
  - the creation reports `prf.enabled` (and gives the outputs if the
    provider already computes them);
  - the same input gives the same output from one sign-in to the next (and
    at creation), through `eval` as through `evalByCredential`;
  - two different inputs give two different outputs, of 32 bytes.
-->
<style>
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 16px; color: #1c1c1e; }
  h1 { font-size: 24px; margin: 4px 0 12px; }
  button { font-size: 16px; padding: 8px 14px; margin: 4px 4px 4px 0; border-radius: 8px; border: 0; background: #5b5cf0; color: white; }
  p.result { font-family: ui-monospace, monospace; font-size: 14px; background: #f2f2f7; padding: 8px; border-radius: 8px; min-height: 1em; word-break: break-all; }
</style>
</head>
<body>
<h1>PRF test bench</h1>
<button id="prf-create" type="button">Create a PRF passkey</button>
<button id="prf-get" type="button">PRF sign-in</button>
<button id="prf-bycred" type="button">PRF sign-in by passkey</button>
<p class="result" id="prf-result">-</p>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
const store = {
  get: (k) => sessionStorage.getItem("verrou-prf-" + k) ?? localStorage.getItem("verrou-prf-" + k),
  set: (k, v) => { localStorage.setItem("verrou-prf-" + k, v); sessionStorage.setItem("verrou-prf-" + k, v); },
};
const SALT_A = enc.encode("verrou-prf-a");
const SALT_B = enc.encode("verrou-prf-b");
const SALT_C = enc.encode("verrou-prf-c");
const out = (text) => { $("prf-result").textContent = text; };

// PRF output: 32 bytes, in base64url.
function output(value, name) {
  if (!value) throw new Error(`PRF output ${name} missing`);
  const bytes = new Uint8Array(value);
  if (bytes.length !== 32) throw new Error(`PRF output ${name} of ${bytes.length} bytes`);
  return b64u(bytes);
}

// Reference output for input A: the first one obtained (creation or
// sign-in); the following ones must equal it.
function stable(a) {
  const reference = store.get("a");
  if (!reference) { store.set("a", a); return true; }
  return reference === a;
}

$("prf-create").addEventListener("click", async () => {
  out("creating…");
  try {
    for (const k of ["id", "a"]) { localStorage.removeItem("verrou-prf-" + k); sessionStorage.removeItem("verrou-prf-" + k); }
    const credential = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { id: location.hostname, name: "Banc d'essai PRF" },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "prf@verrou.test", displayName: "PRF" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }],
      authenticatorSelection: { residentKey: "required", userVerification: "required" },
      attestation: "none", timeout: 120000,
      extensions: { prf: { eval: { first: SALT_A } } },
    } });
    const prf = credential.getClientExtensionResults().prf;
    if (!prf?.enabled) throw new Error("prf.enabled missing: " + JSON.stringify(prf));
    store.set("id", b64u(credential.rawId));
    let results = false;
    if (prf.results?.first) {
      store.set("a", output(prf.results.first, "A"));
      results = true;
    }
    out(`PRF_CREATED ok enabled=true results=${results}`);
  } catch (e) {
    out("PRF_CREATE_ERROR " + e.name + ": " + e.message);
  }
});

async function get(extensions) {
  const id = store.get("id");
  if (!id) throw new Error("no PRF passkey created on this page");
  const credential = await navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
    userVerification: "required", timeout: 120000,
    allowCredentials: [{ type: "public-key", id: unb64u(id) }],
    extensions,
  } });
  if (b64u(credential.rawId) !== id) throw new Error("another passkey");
  const results = credential.getClientExtensionResults().prf?.results;
  if (!results) throw new Error("no PRF output: " + JSON.stringify(credential.getClientExtensionResults()));
  return results;
}

$("prf-get").addEventListener("click", async () => {
  out("signing in…");
  try {
    const results = await get({ prf: { eval: { first: SALT_A, second: SALT_B } } });
    const a = output(results.first, "A");
    const b = output(results.second, "B");
    out(`PRF_SIGNED ok stable=${stable(a)} differ=${a !== b}`);
  } catch (e) {
    out("PRF_GET_ERROR " + e.name + ": " + e.message);
  }
});

$("prf-bycred").addEventListener("click", async () => {
  out("signing in…");
  try {
    // `evalByCredential` takes precedence over `eval` for this passkey: the
    // output is input A's, not C's.
    const results = await get({ prf: {
      eval: { first: SALT_C }, evalByCredential: { [store.get("id")]: { first: SALT_A } },
    } });
    const a = output(results.first, "A");
    out(`PRF_BYCRED ok stable=${stable(a)} second=${results.second !== undefined}`);
  } catch (e) {
    out("PRF_BYCRED_ERROR " + e.name + ": " + e.message);
  }
});
</script>
</body>
</html>
