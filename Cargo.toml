[workspace]
resolver = "3"
members = [
    "crates/verrou-core",
    "crates/verrou-vaultwarden",
    "crates/verrou-cli",
    "crates/verrou-ffi",
    "crates/verrou-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bonout/verrou"
rust-version = "1.88"

[workspace.dependencies]
verrou-core = { path = "crates/verrou-core" }
verrou-vaultwarden = { path = "crates/verrou-vaultwarden" }
verrou-bridge = { path = "crates/verrou-bridge" }
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
rand = "0.8"
rand_chacha = "0.3"
url = "2.5"
psl = "2"
unicode-normalization = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
uniffi = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
# Lecture des exports d'autres gestionnaires (Apple, 1Password, Proton Pass) :
# CSV, et archives ZIP en lecture seule (deflate, sans chiffrement).
csv = "1.4"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# SDK Rust de Bitwarden (GPL-3.0) : le code des apps officielles, épinglé sur
# un commit. Il n'est pas publié sur crates.io ; chaque montée de version est
# une PR à part, qui relance les tests contre un vrai Vaultwarden.
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6", features = ["internal"] }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
