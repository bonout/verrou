[workspace]
resolver = "3"
members = [
    "crates/verrou-core",
    "crates/verrou-vaultwarden",
    "crates/verrou-cli",
    "crates/verrou-ffi",
    "crates/verrou-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bonout/verrou"
rust-version = "1.88"

[workspace.dependencies]
verrou-core = { path = "crates/verrou-core" }
verrou-vaultwarden = { path = "crates/verrou-vaultwarden" }
verrou-bridge = { path = "crates/verrou-bridge" }
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
rand = "0.8"
rand_chacha = "0.3"
url = "2.5"
psl = "2"
regex = "1"
unicode-normalization = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
uniffi = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
# Reading exports from other managers (Apple, 1Password, Proton Pass):
# CSV, and read-only ZIP archives (deflate, no encryption).
csv = "1.4"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Bitwarden's Rust SDK (GPL-3.0): the code of the official apps, pinned to
# a commit. It isn't published on crates.io; each version bump is a
# separate PR, which reruns the tests against a real Vaultwarden.
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6", features = ["internal"] }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-collections = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-send = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }
bitwarden-encoding = { git = "https://github.com/bitwarden/sdk-internal", rev = "229c5b9a897b670ca988b6c03ee8a3c5e90128a6" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Debug: dependencies without full debug info (less disk, faster
# linking), except the line numbers of backtraces.
[profile.dev.package."*"]
debug = "line-tables-only"

# Cryptography optimized even in debug: PBKDF2 (600,000 iterations),
# Argon2 and RSA are 10 to 50 times slower without optimization, and each
# test against Vaultwarden creates and signs in accounts. Only these crates:
# optimizing all dependencies quadruples the cold build.
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.bitwarden-crypto]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.cbc]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
