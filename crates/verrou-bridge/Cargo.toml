[package]
name = "verrou-bridge"
description = "Bridge between Verrou and its clients (browser extension, terminal): pairing, encrypted channel, Native Messaging relay, SSH signatures."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
verrou-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
data-encoding.workspace = true
sha2.workspace = true
rand.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
# Unicode general categories and default-ignorable code points, to show what
# an approval says without invisible characters (already in the tree, via `url`).
icu_properties = "2.1"
tokio = { workspace = true, features = ["net", "io-util", "time"] }
# Key agreement and channel encryption: the same primitives as WebCrypto
# on the extension side (ECDH P-256, HKDF-SHA256, AES-256-GCM).
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"
# SSH agent: sign with the vault's keys, without them leaving the app.
# The version the Bitwarden SDK already uses (a single copy of RSA).
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "p256", "p384", "rsa", "sha1"] }
signature = "3"

[dev-dependencies]
# Paused time, for the plans' timers.
tokio = { workspace = true, features = ["test-util"] }
# Test keys (ssh-key expects a rand_core 0.10 generator).
getrandom = { version = "0.4", features = ["sys_rng"] }

[[bin]]
name = "verrou-native-host"
path = "src/bin/native_host.rs"

[lints]
workspace = true
