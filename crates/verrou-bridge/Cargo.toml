[package]
name = "verrou-bridge"
description = "Pont entre Verrou et ses clients (extension de navigateur, terminal) : appairage, canal chiffré, relais Native Messaging, signatures SSH."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
verrou-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
data-encoding.workspace = true
sha2.workspace = true
rand.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
# Accord de clé et chiffrement du canal : les mêmes primitives que WebCrypto
# côté extension (ECDH P-256, HKDF-SHA256, AES-256-GCM).
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"
# Agent SSH : signer avec les clés du coffre, sans qu'elles quittent l'app.
# La version que le SDK de Bitwarden utilise déjà (une seule copie de RSA).
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "p256", "p384", "rsa", "sha1"] }
signature = "3"

[dev-dependencies]
# Clés de test (ssh-key attend un générateur rand_core 0.10).
getrandom = { version = "0.4", features = ["sys_rng"] }

[[bin]]
name = "verrou-native-host"
path = "src/bin/native_host.rs"

[lints]
workspace = true
