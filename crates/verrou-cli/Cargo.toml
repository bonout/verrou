[package]
name = "verrou-cli"
description = "Verrou on the command line, and its SSH agent."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lib]
name = "verrou_cli"
path = "src/lib.rs"

[[bin]]
name = "verrou"
path = "src/main.rs"

[dependencies]
verrou-core.workspace = true
verrou-bridge.workspace = true
clap.workspace = true
data-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

# Mounted `.env` files (`verrou env`): the FIFO, signals and processes, all
# through safe wrappers (the workspace forbids unsafe code). libproc finds
# who has the FIFO open on macOS; Linux reads /proc.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "signal", "process", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
uuid.workspace = true
# Test SSH keys, checking the agent's signatures.
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa"] }
signature = "3"
getrandom = { version = "0.4", features = ["sys_rng"] }

[lints]
workspace = true
