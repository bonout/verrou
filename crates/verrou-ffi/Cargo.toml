[package]
name = "verrou-ffi"
description = "UniFFI binding between the Rust core and the Apple apps."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "verrou_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
verrou-core.workspace = true
verrou-vaultwarden.workspace = true
verrou-bridge.workspace = true
uniffi = { workspace = true, features = ["cli", "tokio"] }
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize.workspace = true
sha2.workspace = true
tokio.workspace = true
# Keys of the passkeys created for iOS AutoFill.
rand.workspace = true
# Files of the iOS extension (conditional creation, site signals)
# and device settings (`match-rules.json`, `usage.json`).
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests against a real Vaultwarden (`VERROU_TEST_SERVER`): registration of a
# throwaway account, like the tests of `verrou-vaultwarden`.
bitwarden-core.workspace = true
bitwarden-crypto.workspace = true
reqwest.workspace = true
serde_json.workspace = true
# Latency measurement (`tests/latency.rs`): a TCP proxy that delays.
tokio = { workspace = true, features = ["net", "time", "io-util"] }
uuid.workspace = true

[lints]
workspace = true
