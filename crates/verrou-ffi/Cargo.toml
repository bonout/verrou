[package]
name = "verrou-ffi"
description = "Liaison UniFFI entre le cœur Rust et les applications Apple."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "verrou_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
verrou-core.workspace = true
verrou-vaultwarden.workspace = true
verrou-bridge.workspace = true
uniffi = { workspace = true, features = ["cli", "tokio"] }
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
# Tests contre un vrai Vaultwarden (`VERROU_TEST_SERVER`) : inscription d'un
# compte jetable, comme les tests de `verrou-vaultwarden`.
bitwarden-core.workspace = true
bitwarden-crypto.workspace = true
reqwest.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
