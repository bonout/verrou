name: Verrou
options:
  bundleIdPrefix: app.verrou
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Verrou:
    type: application
    platform: macOS
    sources:
      - path: Verrou
      - path: Shared
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac
        PRODUCT_NAME: Verrou
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Verrou/Verrou.entitlements
        OTHER_LDFLAGS: ["-lc++"]
