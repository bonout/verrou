name: Verrou
options:
  bundleIdPrefix: app.verrou
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Groupe d'apps partagé par l'app iPhone et l'extension. Un identifiant de
    # groupe est unique chez Apple : pour un iPhone, passer le sien, par
    # exemple VERROU_APP_GROUP=group.<équipe>.verrou (scripts/install-ios.sh).
    VERROU_APP_GROUP: group.app.verrou
    # Mac : signé ad hoc par défaut, sans groupe d'apps ni extension de
    # remplissage du système. Un build signé par l'équipe
    # (VERROU_MAC_TEAM=<équipe> scripts/install-macos.sh) passe
    # VERROU_MAC_APP_GROUP=<équipe>.app.verrou et
    # VERROU_MAC_ENTITLEMENTS=Verrou/Verrou-team.entitlements : macOS ne valide
    # un groupe d'apps, et ne lance un fournisseur d'identifiants, que pour une
    # app signée par une équipe (voir docs/GUIDE.md).
    VERROU_MAC_APP_GROUP: ""
    VERROU_MAC_ENTITLEMENTS: Verrou/Verrou.entitlements
    # Droits de l'extension VerrouAutoFillMac : aucun en ad hoc (son droit de
    # fournisseur exige un profil ; sans lui, macOS ne l'active jamais, et
    # scripts/install-macos.sh la retire du paquet),
    # VerrouAutoFillMac/VerrouAutoFillMac.entitlements avec l'équipe. Xcode
    # vérifie les extensions après la signature : on ne peut pas la retirer
    # pendant le build.
    VERROU_MAC_AUTOFILL_ENTITLEMENTS: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Verrou:
    type: application
    platform: macOS
    sources:
      - path: Verrou
      - path: Shared
      # Hôte Native Messaging, lancé par le navigateur (pas par l'app) :
      # Contents/MacOS/verrou-native-host, signé avec l'app, sans sandbox.
      - path: Helpers/verrou-native-host
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      # L'extension de navigateur, livrée avec l'app (à charger dans Brave) ;
      # celle de Firefox (extension-firefox) en est tirée après la copie.
      - path: ../extension
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      # Fournisseur d'identifiants du système (Safari, apps du Mac) : retiré
      # du paquet d'un build ad hoc (phase « Fournisseur d'identifiants »).
      - target: VerrouAutoFillMac
    info:
      path: Verrou/Info.plist
      properties:
        VerrouAppGroup: $(VERROU_MAC_APP_GROUP)
    # L'extension copiée donne celle de Firefox (même code, autre manifeste),
    # puis les deux reçoivent une version propre à leur contenu : Brave la
    # recharge d'elle-même quand l'app est mise à jour (extension/update.js).
    postBuildScripts:
      - name: Version de l'extension
        basedOnDependencyAnalysis: false
        script: |
          EXTENSION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/extension"
          "$SRCROOT/../scripts/firefox-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
          "$SRCROOT/../scripts/stamp-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac
        PRODUCT_NAME: Verrou
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: $(VERROU_MAC_ENTITLEMENTS)
        OTHER_LDFLAGS: ["-lc++"]
        # La phase « Version de l'extension » réécrit le manifeste copié dans le
        # paquet et y ajoute l'extension de Firefox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Fournisseur d'identifiants du Mac (Réglages Système → Général →
  # Remplissage automatique et mots de passe) : identifiants, codes et
  # passkeys pour Safari et les apps. Le modèle et le contrôleur sont ceux de
  # l'iPhone (VerrouAutoFill) ; seule l'interface est propre au Mac. Ouvre le
  # coffre du groupe d'apps en invitée, comme sur l'iPhone.
  VerrouAutoFillMac:
    type: app-extension
    platform: macOS
    sources:
      - path: VerrouAutoFillMac
      - path: VerrouAutoFill/AutoFillModel.swift
      - path: VerrouAutoFill/CredentialProviderViewController.swift
      - path: VerrouAutoFill/Memory.swift
      - path: VerrouAutoFill/PasskeyPrf.swift
      - path: VerrouAutoFill/PasskeyPrfSystem.swift
      - path: Shared
      - path: Verrou/Resources/Assets.xcassets
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    info:
      path: VerrouAutoFillMac/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "GPL-3.0-or-later"
        VerrouAppGroup: $(VERROU_MAC_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: false
            ASCredentialProviderExtensionShowsConfigurationUI: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac.autofill
        PRODUCT_NAME: VerrouAutoFillMac
        CODE_SIGN_ENTITLEMENTS: $(VERROU_MAC_AUTOFILL_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUTOFILL_EXTENSION"

  # Tests unitaires du Mac sans app hôte (rien ne s'affiche) : migration du
  # compte vers le groupe d'apps, sélection des entrées PRF.
  #   xcodebuild test -project apple/Verrou.xcodeproj -scheme VerrouMacTests
  VerrouMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VerrouMacTests
      - path: Shared/Core/VerrouStorage.swift
      - path: VerrouAutoFill/PasskeyPrf.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO

  # App iPhone et son extension de remplissage automatique. Simulateur sans
  # compte Apple : signé ad hoc (« - », jamais une équipe de développeur).
  # La signature ad hoc du simulateur garde les droits dans le binaire
  # (section __TEXT,__entitlements) : le groupe d'apps partagé avec
  # l'extension et le droit de fournisseur de remplissage fonctionnent. Un
  # build CODE_SIGNING_ALLOWED=NO n'a aucun droit : pas de groupe d'apps,
  # l'extension ne voit pas le coffre.
  VerrouiOS:
    type: application
    platform: iOS
    sources:
      - path: VerrouiOS
      - path: Shared
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - target: VerrouAutoFill
    # Clés hors INFOPLIST_KEY_*, fusionnées avec l'Info.plist généré.
    info:
      path: VerrouiOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VerrouAppGroup: $(VERROU_APP_GROUP)
        # Réveil d'arrière-plan : nouveautés du partage, notifiées localement
        # (PhoneModel.backgroundActivityCheck, voir SECURITY.md).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.verrou.activite]
    scheme:
      testTargets:
        - VerrouAutoFillUITests
        - VerrouiOSUITests
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios
        PRODUCT_NAME: Verrou
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID déverrouille votre coffre et confirme l'accès aux éléments protégés."
        INFOPLIST_KEY_NSCameraUsageDescription: "La caméra sert à scanner le QR code d'un code à usage unique (double authentification). Aucune image n'est enregistrée."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Groupe d'apps et trousseau partagés avec l'extension VerrouAutoFill :
        # appliqués à la signature (ad hoc comprise, dans le simulateur).
        CODE_SIGN_ENTITLEMENTS: VerrouiOS/VerrouiOS.entitlements
        OTHER_LDFLAGS: ["-lc++"]

  # Extension de remplissage automatique (identifiants, codes, passkeys),
  # dans l'app iPhone. Elle ouvre le coffre du groupe d'apps en invitée
  # (VaultAccess(autofillAt:)) : voir SECURITY.md, « Remplissage automatique ».
  VerrouAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: VerrouAutoFill
      - path: Shared
      - path: VerrouiOS/Resources/Assets.xcassets
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    info:
      path: VerrouAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: "Face ID déverrouille votre coffre pour remplir identifiants, codes et passkeys."
        VerrouAppGroup: $(VERROU_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: false
              # Création conditionnelle (iOS 18) : passkey proposée par
              # Safari en arrière-plan après un mot de passe rempli.
              SupportsConditionalPasskeyRegistration: true
              # Signaux des sites (iOS 26, ASCredentialUpdater).
              SupportsCredentialUpdate: true
            ASCredentialProviderExtensionShowsConfigurationUI: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill
        PRODUCT_NAME: VerrouAutoFill
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        CODE_SIGN_ENTITLEMENTS: VerrouAutoFill/VerrouAutoFill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        # Le pilote de démonstration de l'app n'a rien à faire ici.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUTOFILL_EXTENSION"

  # Test de bout en bout du remplissage (XCUITest) : Safari du simulateur,
  # page de test servie par le Mac. Lancé par scripts/ios-autofill-e2e.sh.
  VerrouAutoFillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouAutoFillUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill-uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  # Vitrine et mesures de l'app iPhone (XCUITest) sur le coffre fictif :
  # captures demandées au script (`simctl io screenshot`), défilement mesuré
  # (XCTOSSignpostMetric). Lancés par scripts/ios-showcase.sh et
  # scripts/ios-bench.sh.
  VerrouiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouiOSUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

schemes:
  VerrouMacTests:
    build:
      targets:
        VerrouMacTests: [test]
    test:
      targets: [VerrouMacTests]
