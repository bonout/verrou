name: Verrou
options:
  bundleIdPrefix: app.verrou
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Verrou:
    type: application
    platform: macOS
    sources:
      - path: Verrou
      - path: Shared
      # Hôte Native Messaging, lancé par le navigateur (pas par l'app) :
      # Contents/MacOS/verrou-native-host, signé avec l'app, sans sandbox.
      - path: Helpers/verrou-native-host
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      # L'extension de navigateur, livrée avec l'app (à charger dans Brave) ;
      # celle de Firefox (extension-firefox) en est tirée après la copie.
      - path: ../extension
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
    # L'extension copiée donne celle de Firefox (même code, autre manifeste),
    # puis les deux reçoivent une version propre à leur contenu : Brave la
    # recharge d'elle-même quand l'app est mise à jour (extension/update.js).
    postBuildScripts:
      - name: Version de l'extension
        basedOnDependencyAnalysis: false
        script: |
          EXTENSION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/extension"
          "$SRCROOT/../scripts/firefox-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
          "$SRCROOT/../scripts/stamp-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac
        PRODUCT_NAME: Verrou
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Verrou/Verrou.entitlements
        OTHER_LDFLAGS: ["-lc++"]
        # La phase « Version de l'extension » réécrit le manifeste copié dans le
        # paquet et y ajoute l'extension de Firefox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # App iPhone et son extension de remplissage automatique. Simulateur sans
  # compte Apple : signé ad hoc (« - », jamais une équipe de développeur).
  # La signature ad hoc du simulateur garde les droits dans le binaire
  # (section __TEXT,__entitlements) : le groupe d'apps partagé avec
  # l'extension et le droit de fournisseur de remplissage fonctionnent. Un
  # build CODE_SIGNING_ALLOWED=NO n'a aucun droit : pas de groupe d'apps,
  # l'extension ne voit pas le coffre.
  VerrouiOS:
    type: application
    platform: iOS
    sources:
      - path: VerrouiOS
      - path: Shared
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - target: VerrouAutoFill
    scheme:
      testTargets:
        - VerrouAutoFillUITests
        - VerrouiOSUITests
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios
        PRODUCT_NAME: Verrou
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID déverrouille votre coffre et confirme l'accès aux éléments protégés."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Groupe d'apps et trousseau partagés avec l'extension VerrouAutoFill :
        # appliqués à la signature (ad hoc comprise, dans le simulateur).
        CODE_SIGN_ENTITLEMENTS: VerrouiOS/VerrouiOS.entitlements
        OTHER_LDFLAGS: ["-lc++"]

  # Extension de remplissage automatique (identifiants, codes, passkeys),
  # dans l'app iPhone. Elle ouvre le coffre du groupe d'apps en invitée
  # (VaultAccess(autofillAt:)) : voir SECURITY.md, « Remplissage automatique ».
  VerrouAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: VerrouAutoFill
      - path: Shared
      - path: VerrouiOS/Resources/Assets.xcassets
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    info:
      path: VerrouAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: "Face ID déverrouille votre coffre pour remplir identifiants, codes et passkeys."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: false
            ASCredentialProviderExtensionShowsConfigurationUI: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill
        PRODUCT_NAME: VerrouAutoFill
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        CODE_SIGN_ENTITLEMENTS: VerrouAutoFill/VerrouAutoFill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        # Le pilote de démonstration de l'app n'a rien à faire ici.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUTOFILL_EXTENSION"

  # Test de bout en bout du remplissage (XCUITest) : Safari du simulateur,
  # page de test servie par le Mac. Lancé par scripts/ios-autofill-e2e.sh.
  VerrouAutoFillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouAutoFillUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill-uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  # Vitrine et mesures de l'app iPhone (XCUITest) sur le coffre fictif :
  # captures demandées au script (`simctl io screenshot`), défilement mesuré
  # (XCTOSSignpostMetric). Lancés par scripts/ios-showcase.sh et
  # scripts/ios-bench.sh.
  VerrouiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouiOSUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
