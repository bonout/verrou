name: Verrou
options:
  bundleIdPrefix: app.verrou
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  # Updates of the Mac app outside the App Store (Verrou/App/Updates.swift).
  # Public: the scripts pass -packageAuthorizationProvider netrc, otherwise
  # Xcode looks for github.com credentials in the keychain and waits for a
  # keychain prompt.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    # Swift 6 language mode: data races are compile errors, and isolation is
    # also checked at run time (a main-actor callback reached from another
    # thread stops the app instead of corrupting memory). Checked by the
    # iPhone showcase on every screen of the demo vault.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # App group shared by the iPhone app and its extension. A group identifier
    # is unique at Apple: for an iPhone, pass your own, for example
    # VERROU_APP_GROUP=group.<team>.verrou (scripts/install-ios.sh).
    VERROU_APP_GROUP: group.app.verrou
    # Mac: signed ad hoc by default, with no app group and no system AutoFill
    # extension. A team-signed build (VERROU_MAC_TEAM=<team>
    # scripts/install-macos.sh) passes VERROU_MAC_APP_GROUP=<team>.app.verrou
    # and VERROU_MAC_ENTITLEMENTS=Verrou/Verrou-team.entitlements: macOS only
    # validates an app group, and only launches a credential provider, for an
    # app signed by a team (see docs/GUIDE.md).
    VERROU_MAC_APP_GROUP: ""
    VERROU_MAC_ENTITLEMENTS: Verrou/Verrou.entitlements
    # Entitlements of the VerrouAutoFillMac extension: none ad hoc (its
    # provider entitlement needs a profile; without it macOS never enables it,
    # and scripts/install-macos.sh removes it from the bundle),
    # VerrouAutoFillMac/VerrouAutoFillMac.entitlements with a team. Xcode
    # checks extensions after signing: it can't be removed during the build.
    VERROU_MAC_AUTOFILL_ENTITLEMENTS: ""
    # EdDSA public key of the updates (scripts/release-macos.sh): empty, the
    # Mac app doesn't look for updates.
    VERROU_SPARKLE_PUBLIC_KEY: ""
    VERROU_SPARKLE_FEED: https://github.com/bonout/verrou/releases/latest/download/appcast.xml
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Verrou:
    type: application
    platform: macOS
    sources:
      - path: Verrou
      - path: Shared
      # Native Messaging host, launched by the browser (not by the app):
      # Contents/MacOS/verrou-native-host, signed with the app, not sandboxed.
      - path: Helpers/verrou-native-host
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      # The command line tool, shipped with the app so that it updates with it:
      # Contents/Helpers/verrou, signed with the app, not sandboxed. Settings
      # give the command that links it into the PATH.
      - path: Helpers/verrou
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
      # The browser extension, shipped with the app (to load in Brave); the
      # Firefox one (extension-firefox) is derived from it after the copy.
      - path: ../extension
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - package: Sparkle
      # System credential provider (Safari, Mac apps): removed from the
      # bundle of an ad hoc build (by scripts/install-macos.sh).
      - target: VerrouAutoFillMac
    info:
      path: Verrou/Info.plist
      properties:
        VerrouAppGroup: $(VERROU_MAC_APP_GROUP)
        # Items dragged from the list to a sidebar folder (Views/FolderTree.swift).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.verrou.items
            UTTypeDescription: Verrou items
            UTTypeConformsTo: [public.data]
        # Updates (Verrou/App/Updates.swift): only builds given the public key
        # (scripts/release-macos.sh) check for them. The app is sandboxed:
        # Sparkle installs through its launcher service.
        SUFeedURL: $(VERROU_SPARKLE_FEED)
        SUPublicEDKey: $(VERROU_SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        # The appcast is signed with the same key, and an update's signature
        # is checked before its disk image is even opened.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        # Downloaded in the background, installed when the app quits (Settings
        # turn it off).
        SUAutomaticallyUpdate: true
    # The copied extension yields the Firefox one (same code, other manifest),
    # then both get a version derived from their content: Brave reloads it by
    # itself when the app is updated (extension/update.js).
    postBuildScripts:
      - name: Extension version
        basedOnDependencyAnalysis: false
        script: |
          EXTENSION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/extension"
          "$SRCROOT/../scripts/firefox-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
          "$SRCROOT/../scripts/stamp-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac
        PRODUCT_NAME: Verrou
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: $(VERROU_MAC_ENTITLEMENTS)
        OTHER_LDFLAGS: ["-lc++"]
        # The "Extension version" phase rewrites the manifest copied into the
        # bundle and adds the Firefox extension next to it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Mac credential provider (System Settings → General → AutoFill &
  # Passwords): logins, codes and passkeys for Safari and apps. The model and
  # controller are the iPhone ones (VerrouAutoFill); only the interface is
  # Mac-specific. Opens the app group's vault as a guest, as on the iPhone.
  VerrouAutoFillMac:
    type: app-extension
    platform: macOS
    sources:
      - path: VerrouAutoFillMac
      - path: VerrouAutoFill/AutoFillModel.swift
      - path: VerrouAutoFill/CredentialProviderViewController.swift
      - path: VerrouAutoFill/Memory.swift
      - path: VerrouAutoFill/RecentFill.swift
      - path: VerrouAutoFill/PasskeyPrf.swift
      - path: VerrouAutoFill/PasskeyPrfSystem.swift
      # Approving from the iPhone is the app's business.
      - path: Shared
        excludes: ["Remote/**", "Diagnostics/**"]
      - path: Verrou/Resources/Assets.xcassets
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    info:
      path: VerrouAutoFillMac/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "GPL-3.0-or-later"
        VerrouAppGroup: $(VERROU_MAC_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: false
            ASCredentialProviderExtensionShowsConfigurationUI: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac.autofill
        PRODUCT_NAME: VerrouAutoFillMac
        CODE_SIGN_ENTITLEMENTS: $(VERROU_MAC_AUTOFILL_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUTOFILL_EXTENSION"

  # Mac unit tests without a host app (nothing is shown): account migration
  # to the app group, PRF input selection, the iPhone approval protocol, the
  # folder tree, AutoFill's "Continue as…" site check, the pinned codes'
  # TOTP (RFC 6238).
  #   xcodebuild test -project apple/Verrou.xcodeproj -scheme VerrouMacTests
  VerrouMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VerrouMacTests
      - path: Shared/Core/VerrouStorage.swift
      - path: VerrouAutoFill/PasskeyPrf.swift
      - path: Shared/Remote/RemoteApproval.swift
      - path: Shared/Core/FolderNode.swift
      - path: VerrouAutoFill/RecentFill.swift
      - path: Shared/Core/PinnedCodes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO

  # iPhone app and its AutoFill extension. Simulator without an Apple
  # account: signed ad hoc ("-", never a developer team). The simulator's ad
  # hoc signature keeps the entitlements in the binary (__TEXT,__entitlements
  # section): the app group shared with the extension and the AutoFill
  # provider entitlement work. A CODE_SIGNING_ALLOWED=NO build has no
  # entitlements: no app group, the extension can't see the vault.
  VerrouiOS:
    type: application
    platform: iOS
    sources:
      - path: VerrouiOS
      - path: Shared
      # Links and the pinned code entity: the widgets show them, the app
      # runs them.
      - path: VerrouWidgets/Common
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - target: VerrouAutoFill
      - target: VerrouSafari
      - target: VerrouWidgets
      # Apple Watch app (pinned codes on the wrist), embedded in the app.
      - target: VerrouWatch
    # Keys outside INFOPLIST_KEY_*, merged into the generated Info.plist.
    info:
      path: VerrouiOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VerrouAppGroup: $(VERROU_APP_GROUP)
        # Background wake-up: sharing updates, notified locally
        # (PhoneModel.backgroundActivityCheck, see SECURITY.md).
        # remote-notification: the Mac's requests (iCloud notifications).
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [app.verrou.activite]
        # Two-factor links: Verrou appears in Settings › General › AutoFill
        # & Passwords › Set Up Codes In (OTPScanFlow.Purpose.link).
        # verrou://: the widgets and the control open the app at a place (VerrouLink); a link only navigates.
        CFBundleURLTypes:
          - CFBundleURLName: app.verrou.ios.otpauth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [otpauth, otpauth-migration]
          - CFBundleURLName: app.verrou.ios.links
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [verrou]
    scheme:
      testTargets:
        - VerrouAutoFillUITests
        - VerrouiOSUITests
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios
        PRODUCT_NAME: Verrou
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks your vault and confirms access to protected items."
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera scans the QR code of a one-time code (two-factor authentication). No image is saved."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App group and keychain shared with the VerrouAutoFill extension:
        # applied at signing (ad hoc included, in the simulator).
        CODE_SIGN_ENTITLEMENTS: VerrouiOS/VerrouiOS.entitlements
        OTHER_LDFLAGS: ["-lc++"]

  # AutoFill extension (logins, codes, passkeys), inside the iPhone app. It
  # opens the app group's vault as a guest (VaultAccess(autofillAt:)): see
  # SECURITY.md, "AutoFill".
  VerrouAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: VerrouAutoFill
      - path: Shared
        excludes: ["Remote/**", "Diagnostics/**"]
      - path: VerrouiOS/Resources/Assets.xcassets
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
      - sdk: AuthenticationServices.framework
    info:
      path: VerrouAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: "Face ID unlocks your vault to fill logins, codes and passkeys."
        VerrouAppGroup: $(VERROU_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: false
              # Conditional creation (iOS 18): passkey offered by Safari in
              # the background after a password is filled.
              SupportsConditionalPasskeyRegistration: true
              # Signals from sites (iOS 26, ASCredentialUpdater).
              SupportsCredentialUpdate: true
            ASCredentialProviderExtensionShowsConfigurationUI: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill
        PRODUCT_NAME: VerrouAutoFill
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        CODE_SIGN_ENTITLEMENTS: VerrouAutoFill/VerrouAutoFill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        # The app's demo driver has no business here.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AUTOFILL_EXTENSION"

  # Safari extension, inside the iPhone app: submits the sign-in forms that
  # iOS AutoFill fills (extension/safari/autofill-submit.js). No access to the
  # vault; the web files sit at the root of the bundle, where Safari looks.
  VerrouSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: VerrouSafari
      - path: ../extension/safari/manifest.json
        buildPhase: resources
      - path: ../extension/safari/autofill-submit.js
        buildPhase: resources
      - path: ../extension/_locales
        type: folder
        buildPhase: resources
      - path: ../extension/icons
        type: folder
        buildPhase: resources
    info:
      path: VerrouSafari/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.safari
        PRODUCT_NAME: VerrouSafari
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  # Widgets, inside the iPhone app: pinned one-time codes (home screen, lock
  # screen, StandBy), quick actions and the Control Center control. No
  # vault, no Rust core: it reads
  # only the codes the user pinned (Shared/Core/PinnedCodes.swift, this
  # device's keychain, the group shared with the app) and opens the app with
  # verrou:// links. See SECURITY.md, "Widgets and Shortcuts".
  VerrouWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VerrouWidgets
      - path: Shared/Core/PinnedCodes.swift
      - path: VerrouiOS/Resources/Assets.xcassets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: VerrouWidgets/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.widgets
        PRODUCT_NAME: VerrouWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        CODE_SIGN_ENTITLEMENTS: VerrouWidgets/VerrouWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Apple Watch app, embedded in the iPhone app: the pinned one-time codes
  # the iPhone sends (WatchConnectivity), kept in the Watch's own keychain.
  # No vault, no Rust core, no network: only Shared/Core/PinnedCodes.swift is
  # compiled in. See SECURITY.md, "Pinned one-time codes".
  VerrouWatch:
    type: application
    platform: watchOS
    sources:
      - path: VerrouWatch
      - path: Shared/Core/PinnedCodes.swift
    dependencies:
      - target: VerrouWatchWidgets
    info:
      path: VerrouWatch/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.verrou.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.watchkitapp
        PRODUCT_NAME: Verrou
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
        # Keychain shared with the complications (the Watch's own group).
        CODE_SIGN_ENTITLEMENTS: VerrouWatch/VerrouWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Complications of the Apple Watch app: a pinned one-time code on the
  # watch face (circular, rectangular, inline). Reads only the codes the
  # Watch app stored (Shared/Core/PinnedCodes.swift).
  VerrouWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: VerrouWatchWidgets
      - path: Shared/Core/PinnedCodes.swift
      - path: VerrouWatch/Resources/Assets.xcassets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: VerrouWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Verrou
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.watchkitapp.widgets
        PRODUCT_NAME: VerrouWatchWidgets
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_HARDENED_RUNTIME: NO
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
        CODE_SIGN_ENTITLEMENTS: VerrouWatchWidgets/VerrouWatchWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # End-to-end AutoFill test (XCUITest): the simulator's Safari, test page
  # served by the Mac. Run by scripts/ios-autofill-e2e.sh.
  VerrouAutoFillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouAutoFillUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.autofill-uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

  # iPhone app showcase and measurements (XCUITest) on the mock vault:
  # screenshots requested from the script (`simctl io screenshot`), measured
  # scrolling (XCTOSSignpostMetric). Run by scripts/ios-showcase.sh and
  # scripts/ios-bench.sh.
  # Accessibility audit of the Mac app (opens it on screen).
  VerrouMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: VerrouMacUITests
    dependencies:
      - target: Verrou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Verrou
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  VerrouiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerrouiOSUITests
    dependencies:
      - target: VerrouiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VerrouiOS
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

schemes:
  VerrouMacUITests:
    build:
      targets:
        VerrouMacUITests: [test]
    test:
      targets: [VerrouMacUITests]
  VerrouMacTests:
    build:
      targets:
        VerrouMacTests: [test]
    test:
      targets: [VerrouMacTests]
