name: Verrou
options:
  bundleIdPrefix: app.verrou
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Verrou:
    type: application
    platform: macOS
    sources:
      - path: Verrou
      - path: Shared
      # Hôte Native Messaging, lancé par le navigateur (pas par l'app) :
      # Contents/MacOS/verrou-native-host, signé avec l'app, sans sandbox.
      - path: Helpers/verrou-native-host
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      # L'extension de navigateur, livrée avec l'app (à charger dans Brave) ;
      # celle de Firefox (extension-firefox) en est tirée après la copie.
      - path: ../extension
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
    # L'extension copiée donne celle de Firefox (même code, autre manifeste),
    # puis les deux reçoivent une version propre à leur contenu : Brave la
    # recharge d'elle-même quand l'app est mise à jour (extension/update.js).
    postBuildScripts:
      - name: Version de l'extension
        basedOnDependencyAnalysis: false
        script: |
          EXTENSION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/extension"
          "$SRCROOT/../scripts/firefox-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
          "$SRCROOT/../scripts/stamp-extension.sh" "$EXTENSION" "$EXTENSION-firefox"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.mac
        PRODUCT_NAME: Verrou
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Verrou/Verrou.entitlements
        OTHER_LDFLAGS: ["-lc++"]
        # La phase « Version de l'extension » réécrit le manifeste copié dans le
        # paquet et y ajoute l'extension de Firefox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # App iPhone (phase 1 : l'app ; phase 2 : l'extension de remplissage
  # automatique). Simulateur sans compte Apple : build non signé ou signé ad
  # hoc (CODE_SIGNING_ALLOWED=NO ou CODE_SIGN_IDENTITY=-), jamais avec une
  # équipe de développeur.
  VerrouiOS:
    type: application
    platform: iOS
    sources:
      - path: VerrouiOS
      - path: Shared
    dependencies:
      - framework: Frameworks/VerrouFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verrou.ios
        PRODUCT_NAME: Verrou
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verrou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID déverrouille votre coffre et confirme l'accès aux éléments protégés."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Groupe d'apps et trousseau partagés avec l'extension (phase 2) :
        # appliqués seulement à la signature.
        CODE_SIGN_ENTITLEMENTS: VerrouiOS/VerrouiOS.entitlements
        OTHER_LDFLAGS: ["-lc++"]
