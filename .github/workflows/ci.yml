name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    # Vaultwarden jetable, même version que la production : les tests
    # d'intégration y créent leurs comptes (connexion, TOTP, synchronisation).
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.4
        ports: ["8099:80"]
        env:
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          SIGNUPS_ALLOWED: "true"
          # WebAuthn (clé de sécurité) exige un nom de domaine.
          DOMAIN: http://localhost:8099
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          LOGIN_RATELIMIT_SECONDS: "1"
          # Inscription, prélogin et jetons d'envoi partagent une limite
          # anonyme (50 d'affilée par IP) : la suite crée des dizaines de comptes.
          UNAUTHENTICATED_RATELIMIT_MAX_BURST: "1000"
    env:
      VERROU_TEST_SERVER: http://localhost:8099
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # L'extension (bridge.js, crypto.js) contre le vrai pont, à travers le
      # vrai hôte Native Messaging.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p verrou-bridge --example test_server --bin verrou-native-host
      - run: node --test extension/test/bridge.test.mjs extension/test/passkeys.test.mjs extension/test/seamless.test.mjs extension/test/firefox.test.mjs extension/test/content.test.mjs
      # Garde-fou de performance : 10 000 éléments, moins d'une image à 60 Hz.
      - run: cargo test --release -p verrou-core --test search -- --include-ignored search_is_fast
      # Doublons : 10 000 éléments en moins de 200 ms.
      - run: cargo test --release -p verrou-core --test duplicates -- --include-ignored duplicates_are_fast

  macos:
    name: App macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      # macOS et simulateur iPhone dans le même xcframework (sans tranche appareil).
      - run: PROFILE=debug PLATFORMS=all TARGETS=aarch64-apple-darwin IOS_TARGETS="" scripts/build-apple.sh
      - run: cd apple && xcodegen generate
      - name: Compiler l'app
        run: |
          xcodebuild -project apple/Verrou.xcodeproj -scheme Verrou -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath target/xcode.noindex \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Compiler l'app iPhone (simulateur, sans signature)
        run: |
          xcodebuild -project apple/Verrou.xcodeproj -scheme VerrouiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath target/xcode-ios.noindex \
            CODE_SIGNING_ALLOWED=NO build
