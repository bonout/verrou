name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Garde-fou de performance : 10 000 éléments, moins d'une image à 60 Hz.
      - run: cargo test --release -p verrou-core --test search -- --include-ignored search_is_fast

  macos:
    name: App macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: PROFILE=debug TARGETS=aarch64-apple-darwin scripts/build-apple.sh
      - run: cd apple && xcodegen generate
      - name: Compiler l'app
        run: |
          xcodebuild -project apple/Verrou.xcodeproj -scheme Verrou -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath target/xcode \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
