name: CI

# Every branch: main's ruleset requires these checks on the very commit
# pushed there, so a branch is pushed and checked first, then main moves to
# it (fast-forward), without bypassing the rule.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # In parallel with the tests: Clippy doesn't need Vaultwarden.
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only GitHub's own actions, pinned by SHA: rustup is already on the runner.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Known vulnerabilities, licenses and sources of the Rust dependencies
  # (deny.toml): a new advisory against a dependency fails here.
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only GitHub's own actions run here: cargo-deny's release binary,
      # checked against its SHA-256.
      - run: |
          version=0.20.2
          sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          archive="cargo-deny-$version-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$archive"
          echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-deny-$version-x86_64-unknown-linux-musl/cargo-deny" check

  rust:
    name: Tests (Rust, extension)
    runs-on: ubuntu-latest
    # Throwaway Vaultwarden, pinned version: the integration
    # tests create their accounts there (sign-in, TOTP, sync).
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.4
        ports: ["8099:80"]
        env:
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
          SIGNUPS_ALLOWED: "true"
          # WebAuthn (security key) requires a domain name.
          DOMAIN: http://localhost:8099
          LOGIN_RATELIMIT_MAX_BURST: "1000"
          LOGIN_RATELIMIT_SECONDS: "1"
          # Registration, prelogin and send tokens share an anonymous
          # limit (50 in a row per IP): the suite creates dozens of accounts.
          UNAUTHENTICATED_RATELIMIT_MAX_BURST: "1000"
    env:
      VERROU_TEST_SERVER: http://localhost:8099
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo test --workspace
      # The extension (bridge.js, crypto.js) against the real bridge, through the
      # real Native Messaging host.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build -p verrou-bridge --example test_server --bin verrou-native-host
      - run: node --test extension/test/*.test.mjs
      # Performance guard: 10,000 items, less than one frame at 60 Hz.
      - run: cargo test --release -p verrou-core --test search -- --include-ignored search_is_fast
      # Duplicates: 10,000 items in less than 200 ms.
      - run: cargo test --release -p verrou-core --test duplicates -- --include-ignored duplicates_are_fast

  macos:
    name: App macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,aarch64-apple-ios-sim && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      # The code targets Xcode 26 (iOS 26 SDK); the runner uses Xcode 16 by default.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen
      # macOS and iPhone simulator in the same xcframework (no device slice).
      - run: PROFILE=debug PLATFORMS=all TARGETS=aarch64-apple-darwin IOS_TARGETS="" scripts/build-apple.sh
      - run: cd apple && xcodegen generate
      - name: Build the app
        run: |
          xcodebuild -project apple/Verrou.xcodeproj -scheme Verrou -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath target/xcode.noindex \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Build the iPhone app (simulator, unsigned)
        run: |
          xcodebuild -project apple/Verrou.xcodeproj -scheme VerrouiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath target/xcode-ios.noindex \
            CODE_SIGNING_ALLOWED=NO build
