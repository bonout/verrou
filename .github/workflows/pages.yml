# The site, verrou.bonout.com: site/ plus the pictures it uses from
# docs/media (kept in one place), published by GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble
        run: |
          mkdir -p _site/media/ios/design/after/sombre
          cp -R site/. _site/
          cp docs/media/icon.png docs/media/02-coffre.png docs/media/demo.mp4 docs/media/ios-app.mp4 _site/media/
          cp docs/media/ios/design/after/sombre/{03-coffre,07-recherche,08-fiche}.png _site/media/ios/design/after/sombre/
          # Every picture the page names must be there.
          grep -o 'media/[^"]*' _site/index.html | sort -u | while read -r file; do
            test -f "_site/$file" || { echo "missing: $file"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
