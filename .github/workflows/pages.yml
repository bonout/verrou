# The site, verrou.bonout.com, in English (/) and French (/fr/): site/ plus
# the pictures it uses from docs/media (kept in one place), published by
# GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble
        run: |
          mkdir -p _site/media
          cp -R site/. _site/
          cp docs/media/icon.png _site/media/
          # Each language's pictures, in its own language: docs/media for
          # English (the README's), docs/media/fr for French.
          for lang in en fr; do
            src=docs/media; [[ $lang == en ]] || src=docs/media/$lang
            mkdir -p _site/media/$lang
            cp $src/02-vault.png _site/media/$lang/mac.png
            cp $src/demo.mp4 $src/ios-app.mp4 _site/media/$lang/
            for shot in 03-vault:ios-vault 07-search:ios-search 08-item:ios-item; do
              cp docs/media/ios/screens/$lang/${shot%%:*}.png _site/media/$lang/${shot#*:}.png
            done
          done
          # Every file a page names must be there.
          grep -ho '"/[a-z][^"#]*\.[a-z0-9]*"' _site/index.html _site/fr/index.html | tr -d '"' | sort -u | while read -r file; do
            test -f "_site$file" || { echo "missing: $file"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
