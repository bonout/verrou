# The site, verrou.bonout.com, in English (/) and French (/fr/): built by
# site/build.py from site/pages, plus the videos from docs/media, published
# by GitHub Pages.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, .github/workflows/pages.yml]
  # The links point to the latest release: release.yml runs this workflow
  # once a release is out (a release published in the UI starts it too).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The download links and the version shown: the latest release.
          version="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          python3 site/build.py _site "${version#v}"
          # The videos and the icon come from docs/media (kept in one place):
          # docs/media for English (the README's), docs/media/<lang> for the
          # other languages.
          mkdir -p _site/media/en
          cp docs/media/icon.png _site/media/
          cp docs/media/demo.mp4 docs/media/ios-app.mp4 _site/media/en/
          for lang in fr de es it; do
            mkdir -p "_site/media/$lang"
            cp "docs/media/$lang/demo.mp4" "docs/media/$lang/ios-app.mp4" "_site/media/$lang/"
          done
          # Every local file a page names must be there.
          find _site -name index.html -exec grep -ho '"/[a-z][^"#]*\.[a-z0-9]*"' {} + | tr -d '"' | sort -u | while read -r file; do
            test -f "_site$file" || { echo "missing: $file"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Tells Bing (ChatGPT search, Copilot), Yandex and the other IndexNow
      # engines which pages changed, instead of waiting for their crawlers.
      - name: IndexNow
        continue-on-error: true
        run: |
          key="$(cd site && ls *.txt | grep -vx llms.txt | sed "s/\.txt$//")"
          urls="$(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -s .)"
          jq -n --arg key "$key" --argjson urls "$urls" \
            '{host: "verrou.bonout.com", key: $key, keyLocation: ("https://verrou.bonout.com/" + $key + ".txt"), urlList: $urls}' \
          | curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @-
